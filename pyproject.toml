[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "odoo-flight-recorder"
version = "0.1.0.dev0"
description = "Evidence-first causal tracing and incident replay primitives for Odoo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Jairo Gelpi Moreno" }]
keywords = ["odoo", "observability", "debugging", "incident-replay", "causal-tracing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Jairogelpi/odoo_flight_recorder"
Documentation = "https://github.com/Jairogelpi/odoo_flight_recorder/tree/main/docs"
Issues = "https://github.com/Jairogelpi/odoo_flight_recorder/issues"
Source = "https://github.com/Jairogelpi/odoo_flight_recorder"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_flight_recorder"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"addons/*/__manifest__.py" = ["B018"]
