services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo_local_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo_local_only}
    command:
      - odoo
      - --database
      - ""
      - --db_host
      - db
      - --db_user
      - ${POSTGRES_USER:-odoo}
      - --db_password
      - ${POSTGRES_PASSWORD:-odoo_local_only}
      - --admin-passwd
      - ${ODOO_MASTER_PASSWORD:-odoo_local_only}
      - --addons-path
      - /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons:ro
      - odoo-data:/var/lib/odoo

volumes:
  postgres-data:
  odoo-data:

